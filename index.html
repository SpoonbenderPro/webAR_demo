<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>WebAR — Smart Tracking + HUD</title>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
      "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js"
    }
  }
  </script>

  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:sans-serif}
    #container{position:fixed;inset:0}
    #hint{position:fixed;left:0;right:0;top:10px;text-align:center;color:#fff;opacity:.9;z-index:3}
    #ui{position:fixed;left:12px;right:12px;bottom:12px;z-index:4;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
    button,a.button{padding:10px 14px;border:0;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;background:#4f46e5;color:#fff;text-decoration:none}
    button.secondary{background:#374151}
    #hiddenVideo{display:none}
    #nudge{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:5;color:#fff;background:#000a;padding:8px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.12);display:none}
  </style>
</head>
<body>
  <div id="hint">Point your camera at the target image</div>
  <div id="container"></div>

  <video id="hiddenVideo" src="./promo.mp4" playsinline webkit-playsinline muted preload="none"></video>

  <div id="ui">
    <button id="startBtn">Start AR</button>
    <button id="muteBtn" class="secondary">Unmute</button>
    <button id="restartBtn" class="secondary">Restart</button>
    <a id="ctaBtn" class="button" href="#" target="_blank" rel="noopener">Visit Site</a>
  </div>

  <div id="nudge">🔊 Tap “Unmute” to enable audio</div>

  <script type="module">
    import * as THREE from 'three';
    import { MindARThree } from 'mindar-image-three';

    const CTA_URL = 'http://cgculture.in/';
    document.getElementById('ctaBtn').href = CTA_URL;

    // DOM elements
    const container = document.getElementById('container');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const muteBtn = document.getElementById('muteBtn');
    const videoEl = document.getElementById('hiddenVideo');
    const hint = document.getElementById('hint');
    const nudge = document.getElementById('nudge');

    // State
    let sessionStarted = false;
    let hasFoundTarget = false;
    let currentMode = 'hud'; // 'ar' | 'hud'
    let lastSwitchTime = 0;
    const SWITCH_COOLDOWN = 800; // ms
    const CONFIDENCE_THRESHOLD = 0.3;

    // Initial video setup
    videoEl.pause();
    videoEl.muted = true;
    videoEl.loop = true;

    // MindAR setup
    const mindar = new MindARThree({
      container,
      imageTargetSrc: './targets.mind',
      uiLoading: 'no',
      uiScanning: 'no',
      uiError: 'no',
    });

    const { renderer, scene, camera } = mindar;
    renderer.setClearColor(0x000000, 0);
    scene.add(new THREE.AmbientLight(0xffffff, 1));

    // AR plane — perfectly fits target image (laps)
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1), // perfectly matches MindAR target
      new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, toneMapped: false })
    );

    // HUD plane — fixed on screen
    const hudScene = new THREE.Scene();
    const hudCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 10);
    const hudPlane = new THREE.Mesh(
      new THREE.PlaneGeometry(1.4, 0.8),
      new THREE.MeshBasicMaterial({ side: THREE.DoubleSide, toneMapped: false })
    );
    hudPlane.position.set(0, 0, -2);
    hudPlane.visible = false;
    hudScene.add(hudPlane);

    const anchor = mindar.addAnchor(0);
    anchor.group.add(plane);

    // Helpers
    const setMuteUI = () => { muteBtn.textContent = videoEl.muted ? 'Unmute' : 'Mute'; };
    const showNudge = () => { nudge.style.display = 'block'; setTimeout(() => nudge.style.display = 'none', 2000); };
    setMuteUI();

    // Target Events
    anchor.onTargetFound = async () => {
      hint.textContent = 'Tracking ✓';
      hasFoundTarget = true;

      if (!sessionStarted) return;
      if (videoEl.paused) {
        try { await videoEl.play(); } catch {
          videoEl.muted = true;
          setMuteUI();
          try { await videoEl.play(); } catch {}
          showNudge();
        }
      }
    };

    anchor.onTargetLost = () => {
      hint.textContent = 'Lost target → HUD mode';
      plane.visible = false;
      hudPlane.visible = true;
      currentMode = 'hud';
    };

    // 🔥 Dynamic confidence-based switch
    anchor.onTargetUpdate = (event) => {
      const confidence = event.detail?.estimate || 0;
      const now = performance.now();

      if (now - lastSwitchTime < SWITCH_COOLDOWN) return;

      if (confidence > CONFIDENCE_THRESHOLD && currentMode !== 'ar') {
        plane.visible = true;
        hudPlane.visible = false;
        currentMode = 'ar';
        lastSwitchTime = now;
        hint.textContent = 'Tracking ✓';
      } 
      else if (confidence <= CONFIDENCE_THRESHOLD && currentMode !== 'hud') {
        plane.visible = false;
        hudPlane.visible = true;
        currentMode = 'hud';
        lastSwitchTime = now;
        hint.textContent = 'Low visibility → HUD mode';
      }
    };

    // Buttons
    muteBtn.addEventListener('click', () => {
      videoEl.muted = !videoEl.muted;
      setMuteUI();
    });

    restartBtn.addEventListener('click', async () => {
      try { await mindar.stop(); } catch {}
      await mindar.start();
    });

    startBtn.addEventListener('click', async () => {
      const videoTex = new THREE.VideoTexture(videoEl);
      videoTex.encoding = THREE.sRGBEncoding;
      plane.material.map = videoTex;
      hudPlane.material.map = videoTex;

      startBtn.disabled = true;
      startBtn.textContent = 'Starting…';

      try {
        await mindar.start();
        sessionStarted = true;

        renderer.setAnimationLoop(() => {
          if (videoEl.readyState >= videoEl.HAVE_CURRENT_DATA)
            videoTex.needsUpdate = true;

          renderer.render(scene, camera);

          // HUD rendering when visible
          if (hudPlane.visible) {
            renderer.clearDepth();
            hudPlane.quaternion.copy(hudCamera.quaternion); // keep static
            renderer.render(hudScene, hudCamera);
          }
        });

        startBtn.textContent = 'Running…';

        if (hasFoundTarget && videoEl.paused) {
          try { await videoEl.play(); } catch {}
        }
      } catch (e) {
        console.error(e);
        startBtn.disabled = false;
        startBtn.textContent = 'Start AR (Retry)';
      }
    });

    // Resize handling
    const ro = new ResizeObserver(() => {
      renderer.setSize(container.clientWidth, container.clientHeight, false);
    });
    ro.observe(container);
  </script>
</body>
</html>
